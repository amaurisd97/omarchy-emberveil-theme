mode = "dark"

accent = "#d4545c"
cursor = "#f8f7f6"
selection = "#3a2427"
selection_foreground = "#110e0e"
selection_background = "#d4545c"

# Degradado del borde activo. Sin angulo = horizontal (izq->der).
# El wallpaper es muy rojo, asi que los tonos medios usan un gris frio (#443c44)
# en vez de rojo oscuro: contrasta contra el fondo sin romper el efecto de
# fundido. Medido contra las zonas del fondo, el gris sube el contraste de
# 1.05-1.13 (invisible) a 1.41-1.67 (visible).
hyprland_active_border = "#d4545c #443c44 #2e2a30 #443c44 #d4545c"

background = "#110e0e"
foreground = "#e4e0dd"

# Superficies y neutros derivados, fijados de forma explicita para que la
# ficha del tema los muestre tal cual y no dependan de la derivacion.
# Los derivados coinciden con lo que Omarchy calcula solo.
dark_background = "#0d0b0b"
darker_background = "#090707"
lighter_background = "#110e0e"
light_foreground = "#e4e0dd"

# muted alimenta el slot ANSI 8 (bright_black), que es el color con el que
# Herdr pinta la fila activa de su sidebar: antes con L=18 era el mas claro de
# los 22 temas stock y dejaba la fila ilegible (1.26:1). Bajado a L=12.3, la
# mediana del catalogo de Omarchy, conservando el matiz 13 del acento.
muted = "#785c54"
orange = "#cf777d"
brown = "#683c3f"

color0 = "#110e0e"
color1 = "#d16168"
color2 = "#e0985c"
color3 = "#cf777d"
color4 = "#d06269"
color5 = "#d26a71"
color6 = "#e09967"
color7 = "#e4e0dd"
