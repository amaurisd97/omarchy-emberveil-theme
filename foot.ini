# Emberveil configuration for foot, the default Omarchy terminal.
#
# This file is a COMPLETE, STANDALONE foot config. Omarchy does not regenerate
# a foot.ini that a theme ships, so the palette below is a copy of colors.toml.
#
# Consequences of shipping this file:
#   - You get the full look out of the box, including the translucent blurred
#     background and the larger font.
#   - Editing colors.toml will NO LONGER update foot automatically. If you
#     change the palette, mirror it in the [colors-dark] section here too.
#
# If you would rather have foot follow colors.toml, delete this file from your
# copy of the theme. Omarchy then regenerates foot.ini from the palette on every
# `omarchy theme set`, and you can still add the presentation settings below to
# your own ~/.config/foot/foot.ini.

[main]
include=~/.local/state/omarchy/toggles/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=11
pad=14x14
initial-window-mode=windowed
workers=0

[colors-dark]
background=110e0e
foreground=e4e0dd

selection-background=d4545c
selection-foreground=110e0e

cursor=110e0e f8f7f6

regular0=110e0e
regular1=d16168
regular2=e0985c
regular3=cf777d
regular4=d06269
regular5=d26a71
regular6=e09967
regular7=e4e0dd

bright0=7d7472
bright1=edc0c3
bright2=f7e4d4
bright3=efd2d4
bright4=ecc0c3
bright5=efc8cb
bright6=f8e8dd
bright7=f8f7f6

# Translucent, blurred background so the wallpaper reads through the terminal.
blur=yes
alpha=0.95

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=beam
blink=yes

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
